<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="55%" stop-color="#5b3fd6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e0ff"/>
    </linearGradient>
  </defs>

  <!-- soft outer glow -->
  <circle cx="128" cy="132" r="118" fill="url(#glow)"/>

  <!-- dark void background dome -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0f0f18"/>

  <!-- main orb -->
  <circle cx="128" cy="132" r="78" fill="url(#orb)"/>

  <!-- top specular highlight -->
  <ellipse cx="104" cy="96" rx="40" ry="22" fill="#ffffff" opacity="0.18" transform="rotate(-28 104 96)"/>

  <!-- rim light -->
  <circle cx="128" cy="132" r="78" fill="none" stroke="#c9b8ff" stroke-width="3" opacity="0.45"/>

  <!-- "L" monogram -->
  <text x="128" y="172" font-family="DejaVu Sans, Arial, sans-serif" font-size="92" font-weight="bold"
        fill="url(#text)" text-anchor="middle">L</text>

  <!-- bottom cyan echo -->
  <circle cx="128" cy="228" r="34" fill="#22d3ee" opacity="0.20"/>
</svg>